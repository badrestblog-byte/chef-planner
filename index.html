function renderControl(){
 const meta={daily:['День','Ежедневные задачи'],weekly:['Неделя','Задачи недели'],monthly:['Месяц','Задачи месяца'],general:['Ген. уборка','Генеральная уборка']};
 const groups=checklistSets[activeChecklist];
 const total=groups.reduce((a,g)=>a+g.items.length,0), done=groups.reduce((a,g)=>a+g.done.filter(Boolean).length,0), pct=total?Math.round(done/total*100):0;

 document.getElementById('control').innerHTML=header('Контроль кухни','Каждая задача раскрывается в отдельный чек-лист')+
 `<div class="seg">${Object.keys(meta).map(k=>`<button class="${k===activeChecklist?'active':''}" onclick="setChecklist('${k}')">${meta[k][0]}</button>`).join('')}</div>
